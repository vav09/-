name: Сборка exe для Windows

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Найти программу (распаковать zip, если загружен архив)
        shell: pwsh
        run: |
          if (-not (Test-Path "app.py")) {
            $zip = Get-ChildItem -Recurse -Filter *.zip | Select-Object -First 1
            if (-not $zip) { Write-Error "Нет ни app.py, ни zip-архива"; exit 1 }
            Write-Host "Распаковываю $($zip.Name)"
            Expand-Archive -Path $zip.FullName -DestinationPath "src" -Force
          }
          $app = Get-ChildItem -Recurse -Filter app.py | Where-Object { $_.FullName -notmatch '\\(build|dist)\\' } | Select-Object -First 1
          if (-not $app) { Write-Error "app.py не найден"; exit 1 }
          Write-Host "Программа в папке: $($app.DirectoryName)"
          "APP_DIR=$($app.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установка библиотек
        working-directory: ${{ env.APP_DIR }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==6.11.1

      - name: Тесты расчёта
        working-directory: ${{ env.APP_DIR }}
        run: python -m unittest -q

      - name: Сборка exe
        working-directory: ${{ env.APP_DIR }}
        run: pyinstaller --noconfirm pkps_exe.spec

      - name: Проверка — exe запускается и отвечает
        working-directory: ${{ env.APP_DIR }}
        shell: pwsh
        run: |
          $env:PKPS_PORT = "8599"
          $env:PKPS_NO_BROWSER = "1"
          $p = Start-Process -FilePath "dist\Volnovoy_moment.exe" -PassThru -RedirectStandardOutput out.txt -RedirectStandardError err.txt
          $ok = $false
          for ($i = 0; $i -lt 90; $i++) {
            Start-Sleep -Seconds 2
            try {
              $r = Invoke-WebRequest -UseBasicParsing -Uri "http://localhost:8599/_stcore/health" -TimeoutSec 5
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch {}
          }
          Get-Content out.txt -ErrorAction SilentlyContinue
          Get-Content err.txt -ErrorAction SilentlyContinue
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { Write-Error "exe не ответил за 3 минуты"; exit 1 }
          Write-Host "exe работает"

      - name: Выложить exe
        uses: actions/upload-artifact@v4
        with:
          name: Volnovoy_moment_Windows
          path: ${{ env.APP_DIR }}/dist/Volnovoy_moment.exe
          retention-days: 90
